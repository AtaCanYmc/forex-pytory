site_name: Forex-Pytory
site_url: https://atacanymc.github.io/forex-pytory/
site_description: Advanced, Modular, and MCP-Ready Economic Events Scraper Library
site_author: Atacan
repo_name: AtaCanYmc/forex-pytory
repo_url: https://github.com/AtaCanYmc/forex-pytory
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

plugins:
  - search

nav:
  - Overview: index.md
  - Getting Started: getting-started.md
  - Usage Guide:
      - Python SDK: usage/library.md
      - Command Line (CLI): usage/cli.md
      - MCP Server: usage/mcp.md
  - Supported Markets: scrapers.md
  - Contributing: contributing.md
