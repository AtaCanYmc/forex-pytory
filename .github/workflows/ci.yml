name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  lint:
    name: Lint & Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Check code formatting with Black
        run: |
          black --check src/ tests/

      - name: Lint code with Flake8
        run: |
          flake8 src/ tests/

      - name: Type check with Mypy
        run: |
          mypy src/ tests/

  test:
    name: Multi-Version Testing
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests with Pytest
        run: |
          pytest tests/ --cov=src/ --cov-report=xml --cov-report=term

  security:
    name: Security Check
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies and security tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" "filelock>=4.2.1" "setuptools>=84.1.0" "soupsieve>=4.0"

      - name: Scan code security with Bandit
        run: |
          bandit -r src/

      - name: Scan dependency vulnerabilities with pip-audit
        run: |
          pip-audit
