[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "forex-pytory"
version = "0.1.1"
description = "A scraper for economic calendars (ForexFactory, CryptoCraft, EnergyExch, MetalsMine)."
authors = [
    { name = "Atacan", email = "atacanymc@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12.3,<4.16.0",
    "cloudscraper~=1.2.71",
    "pandas>=2.2.2,<2.4.0",
    "defusedxml",
    "pydantic>=2.0",
    "mcp>=0.1.0,<3.0.0",
    "rich>=13.0.0",
]

[project.scripts]
forex-scraper = "forex_pytory.cli.main:main"
forex-mcp = "forex_pytory.mcp.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "flake8>=6.0",
    "mypy>=1.0",
]
docs = [
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.24.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
target-version = ["py310"]
line-length = 88

[tool.mypy]
ignore_missing_imports = true
