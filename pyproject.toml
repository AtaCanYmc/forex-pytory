[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "forex-pytory"
version = "0.1.0"
description = "A scraper for economic calendars (ForexFactory, CryptoCraft, EnergyExch, MetalsMine)."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "beautifulsoup4~=4.12.3",
    "cloudscraper~=1.2.71",
    "pandas~=2.2.2",
    "defusedxml",
    "pydantic>=2.0",
    "mcp>=0.1.0",
    "rich>=13.0.0",
]

[project.scripts]
forex-scraper = "forex_pytory.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
