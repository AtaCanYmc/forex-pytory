<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>From portals to consumers</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #bf4520;   /* burnt-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    /* The SVG holds its readable width (min-width == the viewBox width, so the
       type ramp is never silently scaled down). This wrapper lets a narrow
       screen scroll the diagram instead of the whole page. */
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 1000px; display: block; }
    /* Paper has no scrollbar, so the local scroller would clip instead of
       scroll. Let the diagram scale down to the sheet: smaller but whole
       beats sharp but cut off. Must come after the svg rule above - a media
       query adds no specificity, so a later plain rule would win. */
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · forex-pytory</p>
    <h1>From portals to consumers</h1>

    <!-- Replace architecture with a unique slug for this diagram before export. -->
    <div class="diagram-container">
      <svg viewBox="0 0 1000 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc">
        <title id="architecture-title">From portals to consumers</title>
        <desc id="architecture-desc">Four-stage scraping pipeline from financial portals through validation, fanning out to CLI, Python SDK and MCP server.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>

          <!-- OPTIONAL: dot-pattern background. Uncomment the <pattern> and the second <rect> below if you want the dotted paper look. -->
          <!--
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
          </pattern>
          -->
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <!-- <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/> -->

        <path d="M230 100 H270" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M460 100 H500" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M690 100 H730" fill="none" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arrow-accent)"/><path d="M778 140 V182 Q778 190 770 190 H508 Q500 190 500 198 V260" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M826 140 V200 Q826 208 818 208 H708 Q700 208 700 216 V260" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M874 140 V218 Q874 226 882 226 H892 Q900 226 900 234 V260" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="40" y="60" width="190" height="80" rx="6" fill="#f5f5f5"/><rect x="40" y="60" width="190" height="80" rx="6" fill="rgba(45,49,66,0.04)" stroke="#4f5d75" stroke-width="1"/><text x="135.0" y="96.0" text-anchor="middle" font-family="Geist, sans-serif" font-size="13" font-weight="600" fill="#2d3142">Financial Portals</text><text x="135.0" y="114.0" text-anchor="middle" font-family="Geist Mono, monospace" font-size="10" fill="#4f5d75">ForexFactory · CryptoCraft</text><rect x="270" y="60" width="190" height="80" rx="6" fill="#f5f5f5"/><rect x="270" y="60" width="190" height="80" rx="6" fill="#fff" stroke="#2d3142" stroke-width="1"/><text x="365.0" y="96.0" text-anchor="middle" font-family="Geist, sans-serif" font-size="13" font-weight="600" fill="#2d3142">HTTP Engine</text><text x="365.0" y="114.0" text-anchor="middle" font-family="Geist Mono, monospace" font-size="10" fill="#4f5d75">cloudscraper · HTML/HTTPS</text><rect x="500" y="60" width="190" height="80" rx="6" fill="#f5f5f5"/><rect x="500" y="60" width="190" height="80" rx="6" fill="#fff" stroke="#2d3142" stroke-width="1"/><text x="595.0" y="96.0" text-anchor="middle" font-family="Geist, sans-serif" font-size="13" font-weight="600" fill="#2d3142">DOM Parser</text><text x="595.0" y="114.0" text-anchor="middle" font-family="Geist Mono, monospace" font-size="10" fill="#4f5d75">BeautifulSoup4</text><rect x="730" y="60" width="190" height="80" rx="6" fill="#f5f5f5"/><rect x="730" y="60" width="190" height="80" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/><text x="825.0" y="96.0" text-anchor="middle" font-family="Geist, sans-serif" font-size="13" font-weight="600" fill="#2d3142">Validation</text><text x="825.0" y="114.0" text-anchor="middle" font-family="Geist Mono, monospace" font-size="10" fill="#4f5d75">Pydantic v2 EconomicEvent</text><rect x="420" y="260" width="160" height="72" rx="6" fill="#f5f5f5"/><rect x="420" y="260" width="160" height="72" rx="6" fill="#fff" stroke="#2d3142" stroke-width="1"/><text x="500.0" y="292.0" text-anchor="middle" font-family="Geist, sans-serif" font-size="13" font-weight="600" fill="#2d3142">CLI Tool</text><text x="500.0" y="310.0" text-anchor="middle" font-family="Geist Mono, monospace" font-size="10" fill="#4f5d75">forex-scraper · Rich/JSON</text><rect x="620" y="260" width="160" height="72" rx="6" fill="#f5f5f5"/><rect x="620" y="260" width="160" height="72" rx="6" fill="#fff" stroke="#2d3142" stroke-width="1"/><text x="700.0" y="292.0" text-anchor="middle" font-family="Geist, sans-serif" font-size="13" font-weight="600" fill="#2d3142">Python SDK</text><text x="700.0" y="310.0" text-anchor="middle" font-family="Geist Mono, monospace" font-size="10" fill="#4f5d75">list[EconomicEvent]</text><rect x="820" y="260" width="160" height="72" rx="6" fill="#f5f5f5"/><rect x="820" y="260" width="160" height="72" rx="6" fill="#fff" stroke="#2d3142" stroke-width="1"/><text x="900.0" y="292.0" text-anchor="middle" font-family="Geist, sans-serif" font-size="13" font-weight="600" fill="#2d3142">MCP Server</text><text x="900.0" y="310.0" text-anchor="middle" font-family="Geist Mono, monospace" font-size="10" fill="#4f5d75">forex-mcp · JSON-RPC</text>

      </svg>
    </div>
  </div>
</body>
</html>
