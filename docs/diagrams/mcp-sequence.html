<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How an agent queries forex-mcp</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #bf4520;   /* burnt-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    /* The SVG holds its readable width (min-width == the viewBox width, so the
       type ramp is never silently scaled down). This wrapper lets a narrow
       screen scroll the diagram instead of the whole page. */
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    /* Paper has no scrollbar, so the local scroller would clip instead of
       scroll. Let the diagram scale down to the sheet: smaller but whole
       beats sharp but cut off. Must come after the svg rule above - a media
       query adds no specificity, so a later plain rule would win. */
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · MCP over stdio</p>
    <h1>How an agent queries forex-mcp</h1>

    <!-- Replace mcp-sequence with a unique slug for this diagram before export. -->
    <div class="diagram-container">
      <svg viewBox="0 0 960 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mcp-sequence-title mcp-sequence-desc">
        <title id="mcp-sequence-title">How an agent queries forex-mcp</title>
        <desc id="mcp-sequence-desc">Sequence of messages from a user prompt through an LLM agent and the forex-mcp server to the scraper and back.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>

          <!-- OPTIONAL: dot-pattern background. Uncomment the <pattern> and the second <rect> below if you want the dotted paper look. -->
          <!--
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
          </pattern>
          -->
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <!-- <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/> -->

        <line x1="130" y1="100" x2="130" y2="380" stroke="rgba(45,49,66,0.20)" stroke-dasharray="3,3"/><line x1="370" y1="100" x2="370" y2="380" stroke="rgba(45,49,66,0.20)" stroke-dasharray="3,3"/><line x1="610" y1="100" x2="610" y2="380" stroke="rgba(45,49,66,0.20)" stroke-dasharray="3,3"/><line x1="850" y1="100" x2="850" y2="380" stroke="rgba(45,49,66,0.20)" stroke-dasharray="3,3"/><line x1="130" y1="156" x2="369" y2="156" stroke="#4f5d75" stroke-width="1.2"  marker-end="url(#arrow)"/><text x="249.5" y="148" text-anchor="middle" font-family="Geist Mono, monospace" font-size="10" fill="#4f5d75">High-impact Forex releases today?</text><line x1="370" y1="196" x2="609" y2="196" stroke="#4f5d75" stroke-width="1.2"  marker-end="url(#arrow)"/><text x="489.5" y="188" text-anchor="middle" font-family="Geist Mono, monospace" font-size="10" fill="#4f5d75">tools/call fetch_economic_events</text><line x1="610" y1="236" x2="849" y2="236" stroke="#4f5d75" stroke-width="1.2"  marker-end="url(#arrow)"/><text x="729.5" y="228" text-anchor="middle" font-family="Geist Mono, monospace" font-size="10" fill="#4f5d75">Fetch calendar, parse DOM</text><line x1="850" y1="276" x2="611" y2="276" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/><text x="730.5" y="268" text-anchor="middle" font-family="Geist Mono, monospace" font-size="10" fill="#4f5d75">list[EconomicEvent]</text><line x1="610" y1="316" x2="371" y2="316" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/><text x="490.5" y="308" text-anchor="middle" font-family="Geist Mono, monospace" font-size="10" fill="#4f5d75">JSON-RPC result</text><line x1="370" y1="356" x2="131" y2="356" stroke="#bf4520" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/><text x="250.5" y="348" text-anchor="middle" font-family="Geist Mono, monospace" font-size="10" fill="#4f5d75">Summarized release report</text><rect x="50" y="40" width="160" height="56" rx="6" fill="#f5f5f5"/><rect x="50" y="40" width="160" height="56" rx="6" fill="#fff" stroke="#2d3142" stroke-width="1"/><text x="130.0" y="64.0" text-anchor="middle" font-family="Geist, sans-serif" font-size="13" font-weight="600" fill="#2d3142">User</text><text x="130.0" y="82.0" text-anchor="middle" font-family="Geist Mono, monospace" font-size="10" fill="#4f5d75">Prompt</text><rect x="290" y="40" width="160" height="56" rx="6" fill="#f5f5f5"/><rect x="290" y="40" width="160" height="56" rx="6" fill="#fff" stroke="#2d3142" stroke-width="1"/><text x="370.0" y="64.0" text-anchor="middle" font-family="Geist, sans-serif" font-size="13" font-weight="600" fill="#2d3142">LLM Agent</text><text x="370.0" y="82.0" text-anchor="middle" font-family="Geist Mono, monospace" font-size="10" fill="#4f5d75">Claude</text><rect x="530" y="40" width="160" height="56" rx="6" fill="#f5f5f5"/><rect x="530" y="40" width="160" height="56" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/><text x="610.0" y="64.0" text-anchor="middle" font-family="Geist, sans-serif" font-size="13" font-weight="600" fill="#2d3142">forex-mcp</text><text x="610.0" y="82.0" text-anchor="middle" font-family="Geist Mono, monospace" font-size="10" fill="#4f5d75">MCP Server</text><rect x="770" y="40" width="160" height="56" rx="6" fill="#f5f5f5"/><rect x="770" y="40" width="160" height="56" rx="6" fill="#fff" stroke="#2d3142" stroke-width="1"/><text x="850.0" y="64.0" text-anchor="middle" font-family="Geist, sans-serif" font-size="13" font-weight="600" fill="#2d3142">Scraper</text><text x="850.0" y="82.0" text-anchor="middle" font-family="Geist Mono, monospace" font-size="10" fill="#4f5d75">Engine</text>

      </svg>
    </div>
  </div>
</body>
</html>
