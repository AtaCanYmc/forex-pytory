ce" font-size="10" fill="#4f5d75">Summarized release report</text><rect x="50" y="40" width="160" height="56" rx="6" fill="#f5f5f5"/><rect x="50" y="40" width="160" height="56" rx="6" fill="#fff" stroke="#2d3142" stroke-width="1"/><text x="130.0" y="64.0" text-anchor="middle" font-family="Geist, sans-serif" font-size="13" font-weight="600" fill="#2d3142">User</text><text x="130.0" y="82.0" text-anchor="middle" font-family="Geist Mono, monospace" font-size="10" fill="#4f5d75">Prompt</text><rect x="290" y="40" width="160" height="56" rx="6" fill="#f5f5f5"/><rect x="290" y="40" width="160" height="56" rx="6" fill="#fff" stroke="#2d3142" stroke-width="1"/><text x="370.0" y="64.0" text-anchor="middle" font-family="Geist, sans-serif" font-size="13" font-weight="600" fill="#2d3142">LLM Agent</text><text x="370.0" y="82.0" text-anchor="middle" font-family="Geist Mono, monospace" font-size="10" fill="#4f5d75">Claude</text><rect x="530" y="40" width="160" height="56" rx="6" fill="#f5f5f5"/><rect x="530" y="40" width="160" height="56" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/><text x="610.0" y="64.0" text-anchor="middle" font-family="Geist, sans-serif" font-size="13" font-weight="600" fill="#2d3142">forex-mcp</text><text x="610.0" y="82.0" text-anchor="middle" font-family="Geist Mono, monospace" font-size="10" fill="#4f5d75">MCP Server</text><rect x="770" y="40" width="160" height="56" rx="6" fill="#f5f5f5"/><rect x="770" y="40" width="160" height="56" rx="6" fill="#fff" stroke="#2d3142" stroke-width="1"/><text x="850.0" y="64.0" text-anchor="middle" font-family="Geist, sans-serif" font-size="13" font-weight="600" fill="#2d3142">Scraper</text><text x="850.0" y="82.0" text-anchor="middle" font-family="Geist Mono, monospace" font-size="10" fill="#4f5d75">Engine</text>

